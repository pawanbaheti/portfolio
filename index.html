<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{background:#f7f1e3;color:#1b1a17;font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#f7f1e3;z-index:60}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.card{border:2px solid #1b1a17;border-radius:1.25rem;box-shadow:5px 5px 0 #1b1a17;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:8px 8px 0 #1b1a17}
@media(min-width:1024px){@supports(grid-template-rows:subgrid){
.wgrid{row-gap:0}
.wgrid>.wcell{display:grid;grid-row:span 6;grid-template-rows:subgrid;row-gap:0}
.wgrid .wcard{display:grid;grid-row:span 6;grid-template-rows:subgrid;row-gap:0}
}}
.pill{display:inline-flex;align-items:center;gap:.4rem;border:2px solid #1b1a17;border-radius:999px;padding:.2rem .8rem;font-family:'Space Mono',monospace;font-size:.78rem;background:#fff9ea;transition:transform .15s,background .15s}
.pill:hover{transform:translateY(-2px) rotate(-2deg);background:#f5da8e}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:2px solid #1b1a17;border-radius:999px;padding:.7rem 1.3rem;font-weight:700;box-shadow:3px 3px 0 #1b1a17;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #1b1a17}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 #1b1a17}
a:focus-visible,button:focus-visible{outline:3px solid #c4573a;outline-offset:3px;border-radius:8px}
.nl{position:relative}.nl::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:#c4573a;transition:width .2s}.nl:hover::after{width:100%}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-14px)}}
.spin{animation:spin 18s linear infinite}.bob{animation:bob 5s ease-in-out infinite}
.grain{background-image:radial-gradient(#1b1a1714 1px,transparent 1px);background-size:16px 16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.spin,.bob{animation:none}.reveal{opacity:1;transform:none;transition:none}}
</style>

function Reveal({children,className="",delay=0,as:T="div"}){
 const r=useRef(null);
 useEffect(()=>{const el=r.current;if(!el)return;
  if(!("IntersectionObserver" in window)){el.classList.add("in");return}
  const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("in");o.disconnect()}},{threshold:.12});
  o.observe(el);return()=>o.disconnect()},[]);
 return <T ref={r} style={{transitionDelay:delay+"ms"}} className={"reveal "+className}>{children}</T>;
}

function Detail({p,onClose}){
 const ref=useRef(null);
 useEffect(()=>{
  const prev=document.activeElement;
  const k=e=>{if(e.key==="Escape")onClose()};
  document.addEventListener("keydown",k);
  document.body.style.overflow="hidden";
  ref.current&&ref.current.focus();
  return()=>{document.removeEventListener("keydown",k);document.body.style.overflow="";prev&&prev.focus&&prev.focus()};
 },[]);
 const H=({children})=><h4 className="font-mono text-xs uppercase tracking-widest text-clay mt-7 mb-2">{children}</h4>;
 return(
 <div className="fixed inset-0 z-[70] bg-ink/60 flex items-end sm:items-center justify-center sm:p-6" onClick={onClose}>
  <div role="dialog" aria-modal="true" aria-labelledby="dt" onClick={e=>e.stopPropagation()} className="bg-cream w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto border-2 border-ink rounded-t-[1.25rem] sm:rounded-[1.25rem] shadow-[6px_6px_0_#1b1a17]">
   <div className={"relative h-28 border-b-2 border-ink grain grid place-items-center "+p.c}>
    <span className="font-display font-extrabold text-6xl">{p.n}</span>
    <button ref={ref} onClick={onClose} aria-label="Close write-up" className="absolute top-3 right-3 border-2 border-ink rounded-full p-2 bg-white hover:bg-butter transition-colors"><I n="X" size={18}/></button>
   </div>
   <div className="p-6 md:p-8">
    <p className="font-mono text-xs uppercase text-clay">{p.n} / {p.y} · {p.k}</p>
    <h3 id="dt" className="font-display font-extrabold text-3xl mt-1">{p.t}</h3>
    <p className="font-semibold mt-1">{p.tag}</p>
    <H>Overview</H>{p.long.map(x=><p key={x} className="text-ink/85 mb-3 last:mb-0">{x}</p>)}
    <div className="mt-5"><Stats a={p.stats}/></div>
    <H>What I built</H>
    <ul className="space-y-2 list-disc pl-5 marker:text-clay">{p.pts.map(x=><li key={x}>{x}</li>)}</ul>
    <H>How it works</H>
    <ol className="space-y-2 list-decimal pl-5 marker:text-clay marker:font-bold">{p.how.map(x=><li key={x}>{x}</li>)}</ol>
    <H>What I learned</H>
    <ul className="space-y-2 list-disc pl-5 marker:text-clay">{p.learn.map(x=><li key={x}>{x}</li>)}</ul>
    <H>Tech stack</H>
    <ul className="flex flex-wrap gap-2">{p.s.map(s=><li key={s} className="pill">{s}</li>)}</ul>
    <H>Links</H>
    <div className="flex flex-wrap gap-3">
     {p.repo?<a className="pill" href={p.repo} target="_blank" rel="noopener noreferrer"><I n="Github" size={13}/>Repository <I n="ArrowUpRight" size={13}/></a>:<span className="pill bg-sand opacity-80"><I n="Github" size={13}/>Repository link soon</span>}
     {p.demo?<a className="pill" href={p.demo} target="_blank" rel="noopener noreferrer"><I n="Globe" size={13}/>Live demo <I n="ArrowUpRight" size={13}/></a>:<span className="pill bg-sand opacity-80"><I n="Globe" size={13}/>Live demo link soon</span>}
     <a className="pill" href={GITHUB} target="_blank" rel="noopener noreferrer">GitHub profile <I n="ArrowUpRight" size={13}/></a>
    </div>
    <button onClick={onClose} className="btn bg-butter mt-8"><I n="ArrowLeft" size={16}/>Back to projects</button>
   </div>
  </div>
 </div>);
}
